name: AI Code Review - qeere

on:
pull_request:
    types:
    - opened
    - synchronize
    - reopened

permissions:
contents: write
pull-requests: write

jobs:
ai-code-review:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
        uses: actions/checkout@v4
        with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Get PR information
        run: |
        echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
        echo "BASE_BRANCH=main" >> "$GITHUB_ENV"
        echo "HEAD_BRANCH=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_ENV"

    - name: Setup Python virtual environment
        run: |
        python3 -m venv .venv
        .venv/bin/python -m pip install --upgrade pip

    - name: Install dependencies
        run: |
        .venv/bin/python -m pip install -r requirements.txt

    - name: Generate PR diff
        run: |
        git fetch origin "$BASE_BRANCH"
        git diff "origin/$BASE_BRANCH...HEAD" > pr_diff.txt

    - name: Claude AI Code Review
        env:
        ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
        ANTHROPIC_MODEL: ${{ vars.REVIEW_QEERE_MODEL }}
        REVIEW_MODE: ${{ vars.REVIEW_QEERE_MODE }}
        REVIEW_SKILLS: ${{ vars.REVIEW_QEERE_SKILLS }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        run: |
        .venv/bin/python                 "$GITHUB_WORKSPACE/scripts/ai_code_review.py"                 --diff "$GITHUB_WORKSPACE/pr_diff.txt"                 --pr-number "$PR_NUMBER"                 --repository "$REPOSITORY"                 --review-mode "$REVIEW_MODE"                 --skills "$REVIEW_SKILLS"

    - name: Validate review result
        run: |
        test -s review_result.json
        .venv/bin/python -m json.tool review_result.json > /dev/null

    - name: Publish AI Review
        env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
        .venv/bin/python                 "$GITHUB_WORKSPACE/scripts/publish_review.py"                 --pr-number "$PR_NUMBER"                 --review-file review_result.json

    - name: Send reviewer notification
        env:
        SMTP_HOST: ${{ vars.SMTP_HOST }}
        SMTP_PORT: ${{ vars.SMTP_PORT }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        REVIEWER_EMAIL: ${{ vars.REVIEWER_EMAIL }}
        run: |
        .venv/bin/python                 "$GITHUB_WORKSPACE/scripts/send_review_email.py"                 --review-file review_result.json                 --pr-number "$PR_NUMBER"                 --repository "${{ github.repository }}"
